name: Release (Simplified)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            binary_name: kubiks
          - os: macos-latest
            target: darwin
            binary_name: kubiks
          - os: windows-latest
            target: windows
            binary_name: kubiks.exe
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: instrumentation/package-lock.json
    
    - name: Build
      run: |
        # Install dependencies
        go mod download
        cd instrumentation && npm install && npm run build && cd ..
        
        # Build binary
        CGO_ENABLED=0 go build -ldflags="-s -w" -o ${{ matrix.binary_name }} .
        
        # Create archive with just the binary
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          7z a kubiks-${{ matrix.target }}.zip ${{ matrix.binary_name }}
        else
          tar -czf kubiks-${{ matrix.target }}.tar.gz ${{ matrix.binary_name }}
        fi
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          kubiks-${{ matrix.target }}.tar.gz
          kubiks-${{ matrix.target }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: build-and-release
    runs-on: ubuntu-latest
    
    steps:
    - name: Wait for release assets
      run: sleep 30
    
    - name: Get version
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Calculate SHA256 for macOS binary
      id: sha256
      run: |
        # Download the macOS archive
        curl -L -o kubiks-darwin.tar.gz \
          "https://github.com/kubiks-inc/kubiks-cli/releases/download/v${{ steps.version.outputs.version }}/kubiks-darwin.tar.gz"
        
        # Calculate SHA256
        SHA256=$(shasum -a 256 kubiks-darwin.tar.gz | cut -d' ' -f1)
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
    
    - name: Checkout tap
      uses: actions/checkout@v4
      with:
        repository: kubiks-inc/tap
        token: ${{ secrets.HOMEBREW_TOKEN }}
    
    - name: Update formula
      run: |
        cat > Formula/kubiks.rb << EOF
class Kubiks < Formula
  desc "AI-powered debugging for Next.js with OpenTelemetry and MCP integration"
  homepage "https://github.com/kubiks-inc/kubiks-cli"
  url "https://github.com/kubiks-inc/kubiks-cli/releases/download/v${{ steps.version.outputs.version }}/kubiks-darwin.tar.gz"
  sha256 "${{ steps.sha256.outputs.sha256 }}"
  version "${{ steps.version.outputs.version }}"

  def install
    bin.install "kubiks"
  end

  test do
    assert_match "kubiks", shell_output("#{bin}/kubiks --help")
  end
end
EOF
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/kubiks.rb
        git commit -m "Update kubiks to ${{ steps.version.outputs.version }}"
        git push