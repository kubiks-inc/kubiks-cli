name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        go-version: [ '1.24' ]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: instrumentation/package-lock.json
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
    
    - name: Install dependencies
      run: |
        go mod download
        cd instrumentation && npm install
    
    - name: Build instrumentation
      run: |
        cd instrumentation && npm run build
        # Copy instrumentation file for embedding
        cp dist/instrumentation.bundled.js ../internal/instrumentation/instrumentation.bundled.js
    
    - name: Verify go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need formatting:"
          gofmt -s -l .
          exit 1
        fi
    
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Generate coverage report
      run: go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
    

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: instrumentation/package-lock.json
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-build-
    
    - name: Install dependencies
      run: |
        go mod download
        cd instrumentation && npm install
    
    - name: Build instrumentation
      run: |
        cd instrumentation && npm run build
        # Copy instrumentation file for embedding
        cp dist/instrumentation.bundled.js ../internal/instrumentation/instrumentation.bundled.js
    
    - name: Build application
      run: make build
    
    - name: Test binary execution
      run: |
        ./bin/kubiks --help
        # Test that the binary was built correctly
        if [ ! -f ./bin/kubiks ]; then
          echo "Binary not found"
          exit 1
        fi
        echo "Binary built successfully with embedded instrumentation"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kubiks-linux-amd64
        path: bin/kubiks