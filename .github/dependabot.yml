version: 2
updates:
  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "kubiks-inc/maintainers"
    assignees:
      - "kubiks-inc/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/instrumentation"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "kubiks-inc/maintainers"
    assignees:
      - "kubiks-inc/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "kubiks-inc/maintainers"
    assignees:
      - "kubiks-inc/maintainers"
    commit-message:
      prefix: "ci"
      include: "scope"